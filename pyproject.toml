[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Retrieval-augmented question answering over local documents, built without a RAG framework (ENG-RAG-001)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "scripts", "evals", "tests"]
extraPaths = ["src", "."]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
